<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat App · UI/UX改善モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { height: 100%; }
  body { background: #f0eee9; }
  .canvas-frame {
    border-radius: 14px;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: var(--bg);
    isolation: isolate;
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(20,30,50,0.08), 0 1px 2px rgba(20,30,50,0.04);
  }
  .desktop-host {
    width: 100%; height: 100%; display: flex;
  }
  .desktop-host .app {
    border-radius: 0;
    border: 0;
    box-shadow: none;
    width: 100%; height: 100%;
    flex: 1;
  }
  /* iPhone-ish frame for mobile artboards */
  .phone {
    width: 100%; height: 100%;
    border-radius: 44px;
    background: #1a1d24;
    padding: 12px;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.05),
      0 30px 60px rgba(20,30,50,0.18),
      0 8px 16px rgba(20,30,50,0.08);
  }
  .phone-screen {
    width: 100%; height: 100%;
    border-radius: 32px;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .phone-notch {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 100px; height: 28px;
    border-radius: 14px;
    background: #0a0c10;
    z-index: 10;
  }
  /* Note overlays for callouts */
  .callout {
    position: absolute;
    background: #fef4a8;
    color: #5a4a2a;
    padding: 8px 11px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.45;
    box-shadow: 0 4px 12px rgba(40,30,10,0.12);
    max-width: 220px;
    z-index: 20;
    transform: rotate(-1deg);
  }
  .callout::before {
    content: "";
    position: absolute;
    background: inherit;
    width: 10px; height: 10px;
    transform: rotate(45deg);
  }
  .callout.tl::before { top: -4px; left: 18px; }
  .callout.tr::before { top: -4px; right: 18px; }
  .callout.bl::before { bottom: -4px; left: 18px; }
  /* hide scrollbars inside artboards */
  .canvas-frame *::-webkit-scrollbar { display: none; }
  .canvas-frame * { scrollbar-width: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="channel.jsx"></script>
<script type="text/babel" src="home-search.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>

<script type="text/babel">
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "theme": "light",
    "listWidth": "standard",
    "railHidden": false
  }/*EDITMODE-END*/;

  function App() {
    const [tweaks, setTweak] = window.useTweaks ? window.useTweaks(TWEAKS) : [TWEAKS, () => {}];

    React.useEffect(() => {
      document.documentElement.setAttribute("data-theme", tweaks.theme);
    }, [tweaks.theme]);

    // App config shared across artboards
    const appCfg = {
      "data-list-width": tweaks.listWidth,
      "data-rail": tweaks.railHidden ? "hidden" : "visible",
    };

    return (
      <>
        <DesignCanvas>
          <DCSection id="desktop" title="Desktop · 1280×800" subtitle="3画面 — Home / Channel / Search">

            {/* Desktop · Home (Focus inbox) */}
            <DCArtboard id="d-home" label="01 · Home — Focus inbox" width={1280} height={800}>
              <div className="canvas-frame">
                <div className="desktop-host">
                  <div className="app" {...appCfg}>
                    <Rail active="home" inboxCount={4}/>
                    <ListColumn/>
                    <Home/>
                  </div>
                </div>
              </div>
            </DCArtboard>

            {/* Desktop · Channel + Context rail */}
            <DCArtboard id="d-channel" label="02 · Channel — Context rail展開" width={1280} height={800}>
              <div className="canvas-frame">
                <div className="desktop-host">
                  <ChannelArtboard {...appCfg}/>
                </div>
              </div>
            </DCArtboard>

            {/* Desktop · Search */}
            <DCArtboard id="d-search" label="03 · Search — 保存ビュー" width={1280} height={800}>
              <div className="canvas-frame">
                <div className="desktop-host">
                  <div className="app" {...appCfg}>
                    <Rail active="search"/>
                    <ListColumn/>
                    <SearchView/>
                  </div>
                </div>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="mobile" title="Mobile · 390×844" subtitle="3画面 — Home / Channel / Search">
            <DCArtboard id="m-home" label="04 · Mobile Home" width={420} height={870}>
              <div className="phone">
                <div className="phone-screen">
                  <div className="phone-notch"/>
                  <MobHome/>
                </div>
              </div>
            </DCArtboard>
            <DCArtboard id="m-channel" label="05 · Mobile Channel" width={420} height={870}>
              <div className="phone">
                <div className="phone-screen">
                  <div className="phone-notch"/>
                  <MobChannel/>
                </div>
              </div>
            </DCArtboard>
            <DCArtboard id="m-search" label="06 · Mobile Search" width={420} height={870}>
              <div className="phone">
                <div className="phone-screen">
                  <div className="phone-notch"/>
                  <MobSearch/>
                </div>
              </div>
            </DCArtboard>
          </DCSection>

          <DCSection id="notes" title="設計メモ" subtitle="改善方針サマリー">
            <DCArtboard id="notes-1" label="改善方針" width={520} height={580}>
              <div style={{
                width: "100%", height: "100%",
                background: "var(--bg)", color: "var(--text)",
                padding: "32px 36px",
                fontFamily: "var(--font-sans)",
                overflow: "auto",
                borderRadius: 14,
                border: "1px solid var(--border)",
                boxShadow: "var(--shadow-2)",
              }}>
                <div style={{
                  fontSize: 11, fontWeight: 600, color: "var(--accent)",
                  letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 8
                }}>改善方針 · v1</div>
                <h2 style={{
                  margin: "0 0 14px", fontSize: 22, letterSpacing: "-0.02em"
                }}>サイドバーの再編と<br/>「受信箱中心」のUX</h2>
                <p style={{ color: "var(--text-muted)", fontSize: 13.5, lineHeight: 1.65 }}>
                  現状の課題（機能が雑多に並列・視覚的階層が弱い）を、<strong style={{ color: "var(--text)" }}>2層構造のサイドバー</strong>と<strong style={{ color: "var(--text)" }}>Focus inbox</strong>で解消する。
                </p>

                <div style={{ height: 14 }}/>

                <div style={{ display: "grid", gap: 12 }}>
                  <Bullet n="1" t="アイコンレール + リスト列" d="左64pxにナビ集約、右280pxに文脈別リスト。テンプレ・管理画面はサイドバーから外し、コマンドパレット⌘Kへ。"/>
                  <Bullet n="2" t="Focus inbox（新）" d="メンション・スレッド返信・リマインダー・下書きをホームに集約。1日の入口を1画面に。"/>
                  <Bullet n="3" t="Context rail（新）" d="チャンネル右側に折り畳み式の文脈ペイン。ピン留め・メンバー・ファイル・予定をタブで切替。"/>
                  <Bullet n="4" t={'メッセージは「バブルなし」'} d="名前・時刻・本文を静かに並べる。ホバーでアクション・リアクションが立ち上がる。"/>
                  <Bullet n="5" t="検索は保存ビュー駆動" d="チップ式フィルタ + 保存ビューをファーストクラス化。サイドバーの「保存ビュー」セクションを廃止。"/>
                </div>

                <div style={{ height: 14 }}/>
                <div style={{
                  background: "var(--surface-2)", border: "1px solid var(--border)",
                  borderRadius: 8, padding: "10px 12px",
                  fontSize: 12, color: "var(--text-muted)", lineHeight: 1.6
                }}>
                  <strong style={{ color: "var(--text)" }}>Tweaks:</strong> ライト/ダーク、サイドバー幅(コンパクト/標準/広め)、レール非表示。右下のTweaksボタンから切替可能。
                </div>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>

        {window.TweaksPanel && (
          <TweaksPanel>
            <TweakSection title="テーマ">
              <TweakRadio label="モード" value={tweaks.theme}
                onChange={v => setTweak("theme", v)}
                options={[{value:"light",label:"Light"},{value:"dark",label:"Dark"}]}/>
            </TweakSection>
            <TweakSection title="レイアウト">
              <TweakSelect label="リスト列の幅" value={tweaks.listWidth}
                onChange={v => setTweak("listWidth", v)}
                options={[
                  {value:"compact",label:"コンパクト (240)"},
                  {value:"standard",label:"標準 (280)"},
                  {value:"wide",label:"広め (320)"},
                ]}/>
              <TweakToggle label="アイコンレールを隠す" value={tweaks.railHidden}
                onChange={v => setTweak("railHidden", v)}/>
            </TweakSection>
          </TweaksPanel>
        )}
      </>
    );
  }

  function Bullet({ n, t, d }) {
    return (
      <div style={{ display: "flex", gap: 12 }}>
        <div style={{
          width: 24, height: 24, borderRadius: 6,
          background: "var(--accent-soft)", color: "var(--accent)",
          display: "grid", placeItems: "center",
          fontSize: 12, fontWeight: 600, flexShrink: 0,
          fontVariantNumeric: "tabular-nums"
        }}>{n}</div>
        <div>
          <div style={{ fontSize: 13.5, fontWeight: 600, marginBottom: 2 }}>{t}</div>
          <div style={{ fontSize: 12.5, color: "var(--text-muted)", lineHeight: 1.55 }}>{d}</div>
        </div>
      </div>
    );
  }

  function ChannelArtboard(appCfg) {
    const [ctx, setCtx] = React.useState(true);
    return (
      <div className="app" {...appCfg} data-context={ctx}>
        <Rail active="channels"/>
        <ListColumn/>
        <div className="main">
          <ChannelTopbar contextOn={ctx} onContext={() => setCtx(!ctx)}/>
          <Stream/>
          <Composer/>
        </div>
        {ctx && <ContextRail/>}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
