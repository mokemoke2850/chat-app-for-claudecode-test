<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App — カレンダー機能モック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Roboto", "Noto Sans JP", system-ui, -apple-system, Segoe UI, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
      }
      /* scrollbar subtle */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.25); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.45); }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>

    <!-- React + MUI umd -->
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@emotion/react@11.11.1/dist/emotion-react.umd.min.js" crossorigin></script>
    <script src="https://unpkg.com/@emotion/styled@11.11.0/dist/emotion-styled.umd.min.js" crossorigin></script>
    <script src="https://unpkg.com/@mui/material@5.15.20/umd/material-ui.development.js" crossorigin></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Tweak defaults -->
    <script>
      window.__TWEAK_DEFAULTS__ = /*EDITMODE-BEGIN*/{
        "defaultView": "month",
        "accentHue": 210,
        "showChannelPanel": true,
        "pollStyle": "heatmap"
      }/*EDITMODE-END*/;
    </script>

    <script type="text/babel" data-presets="react" src="./calendar-mock/data.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/shell.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/month.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/week.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/agenda.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/event-dialog.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/event-detail.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/channel-panel.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/tweaks.jsx"></script>
    <script type="text/babel" data-presets="react" src="./calendar-mock/app.jsx"></script>
  </body>
</html>
